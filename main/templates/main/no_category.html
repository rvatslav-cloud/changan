{% extends 'main/base.html' %}

{% block title %}Приложения без категории{% endblock %}

{% block content %}
    <p><a href="{% url 'main:index' %}"> <- На главную</a></p>
    <h2>Приложения без категории</h2>
    
    {% for app in apps %}
        <p><a href="{% url 'main:app_detail' app.id %}">{{ app.name }}</a></p>
    {% empty %}
        <p>Приложений без категории нет</p>
    {% endfor %}
{% endblock %}
