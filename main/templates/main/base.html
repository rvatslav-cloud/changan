{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <title> {% block title %}LG STORE{% endblock %} </title>
</head>
<body>
    <h1> LG STORE </h1>
    <nav>
        <a href="{% url 'main:index' %}">Главная</a>
        <a href="{% url 'main:new' %}">Новинки</a>
        <a href="{% url 'main:top' %}" class="{% if request.path == '/top/' %}active{% endif %}">Топ по цене</a>
        <a href="{% url 'main:free' %}" class="{% if request.path == '/free/' %}active{% endif %}">Бесплатные</a>
        <a href="{% url 'main:reviews' %}">Отзывы</a>
        <a href="{% url 'main:about' %}">О магазине</a>
    </nav>

    {% block search_form %}
    <form method="GET" action="{% url 'main:index' %}">
        <input type="text" name="q" placeholder="Поиск приложений..." value="{{ q }}">
        {% if request.GET.sort %}
        <input type="hidden" name="sort" value="{{ request.GET.sort }}">
        {% endif %}
        <button type="submit">Найти</button>
    </form>
    {% endblock %}
    {% block content %}{% endblock %}
</body>
</html>
